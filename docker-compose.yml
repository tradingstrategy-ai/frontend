# A docker-compose file to run frontend SvelteKit SSR with node-adapter.
#
# The Docker container is automatically built by the Github action in javascript.yml.
#
version: '3.9'
services:
  frontend:
    # Check every configured dependency without starting the web server:
    # docker compose run --rm frontend node scripts/check-connectivity.mjs
    image: 'ghcr.io/tradingstrategy-ai/frontend:${TS_PUBLIC_FRONTEND_VERSION_TAG}'
    ports:
      # The production server has :80 port bind by Caddy.
      # Mapped in reverse proxy Caddyfile
      # https://github.com/tradingstrategy-ai/proxy-server/blob/master/Caddyfile
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    command: node --require dd-trace/init scripts/server.js
    # Restart node service if it crashes
    restart: unless-stopped
    # /health probes DNS and the filesystem through the libuv threadpool, so a process whose
    # pool is starved by native jobs turns unhealthy (and gets restarted by autoheal) instead
    # of staying "up" while every server-side fetch fails. The probe targets an IP literal so
    # it never depends on DNS itself. See docs/server-threadpool.md.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # See https://stackoverflow.com/a/67158212/315168
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/app/data:ro
      - strategies-cache:/app/cache
    environment:
      # Public SvelteKit env vars
      - TS_PUBLIC_SITE_MODE
      - TS_PUBLIC_FRONTEND_VERSION_TAG
      - TS_PUBLIC_BACKEND_URL
      # Prefer an IP literal here (e.g. http://172.17.0.1:3456) over host.docker.internal:
      # a hostname costs one dns.lookup per connection on the threadpool, an IP costs nothing.
      - TS_PUBLIC_BACKEND_INTERNAL_URL
      - TS_PUBLIC_SENTRY_DSN
      - TS_PUBLIC_GHOST_CONTENT_API_KEY
      - TS_PUBLIC_GHOST_API_URL
      - TS_PUBLIC_DISCORD_URL
      - TS_PUBLIC_TURNSTILE_SITE_KEY
      - TS_PUBLIC_STRATEGIES
      - TS_PUBLIC_GEO_BLOCK
      - TS_PUBLIC_ANNOUNCEMENT
      - TS_PUBLIC_TOS_CONTRACTS
      - TS_PUBLIC_WALLET_CONNECT_PROJECT_ID
      - TS_PUBLIC_RPC_URLS
      - TS_PUBLIC_CHAINS_UNDER_MAINTENANCE
      - TS_PUBLIC_MAINTENANCE_NOTICE
      - TS_PUBLIC_VAULT_PROTOCOL_METADATA_URL
      - TS_PUBLIC_VAULT_SPARKLINES_URL
      - TS_PUBLIC_VAULT_API_URL
      - TS_PUBLIC_STABLECOIN_METADATA_URL
      - TS_PUBLIC_SAMPLE_DATA_URL
      - TS_PUBLIC_CREEM_CHECKOUT_URL
      # Private (secret) SvelteKit env vars
      - TS_PRIVATE_ADMIN_PW
      - TS_PRIVATE_R2_ACCOUNT_ID
      - TS_PRIVATE_R2_ACCESS_KEY_ID
      - TS_PRIVATE_R2_SECRET_ACCESS_KEY
      - TS_PRIVATE_R2_BUCKET_NAME
      - TS_PRIVATE_TOP_VAULTS_URL
      - TS_PRIVATE_VAULT_PRICES_PARQUET_URL
      - TS_PRIVATE_MAILERLITE_URL
      - TS_PRIVATE_MAILERLITE_API_KEY
      - TS_PRIVATE_MAILERLITE_GROUPS
      - TS_PRIVATE_TURNSTILE_SECRET_KEY
      - TS_PRIVATE_STRATEGIES_CACHE_DIR=/app/cache/strategies
      # Required for node adapter; see:
      # https://svelte.dev/docs/kit/adapter-node#Environment-variables-ORIGIN-PROTOCOL_HEADER-HOST_HEADER-and-PORT_HEADER
      - FRONTEND_PROTOCOL_HEADER
      - FRONTEND_HOST_HEADER
      # https://www.npmjs.com/package/@trading-strategy-ai/web-top-node
      - TOP_WEB_API_KEY
      # Datadog APM env vars
      - DD_ENV=${DD_ENV:-local}
      - DD_VERSION=${TS_PUBLIC_FRONTEND_VERSION_TAG}
      - DD_TRACE_AGENT_URL
      - DD_DOGSTATSD_URL
      # Temporarily set DIAGNOSE=1, recreate the service, then inspect its logs:
      # docker compose up -d --force-recreate frontend && docker compose logs -f frontend
      - DIAGNOSE
      # SigNoz OTLP endpoint (optional — unset disables SigNoz export entirely);
      # headers only needed if the collector requires an ingestion key. See docs/monitoring.md
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_HEADERS

volumes:
  # Single-host persistent cache. `docker compose down -v` deliberately removes it.
  strategies-cache:

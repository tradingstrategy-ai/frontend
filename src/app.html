<!doctype html>
<html lang="en" data-color-mode="%ts:color-mode%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			The web fonts' @font-face rules, inlined by hooks.server.ts (src/lib/server/font-faces.ts)
			so they apply from the first paint without a request.
		-->
		%ts:font-faces% %sveltekit.head%
	</head>
	<body>
		<!-- Preserve a user tap on a search field while client hydration attaches handlers. -->
		<script>
			document.addEventListener(
				'focusin',
				(event) => {
					if (event.target instanceof HTMLInputElement && event.target.matches('[data-preserve-hydration-focus]')) {
						event.target.dataset.prehydrationFocus = 'true';
					}
				},
				true
			);
		</script>
		<div>%sveltekit.body%</div>
	</body>
</html>
